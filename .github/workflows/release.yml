name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: sudo apt-get install -y mingw-w64

      - name: Build release
        run: make release

      - name: Package
        run: |
          zip eternal-night-${{ github.ref_name }}-windows.zip build/game.exe data.pak

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: eternal-night-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
